name: Keep-alive (Render)

# RESERVA. O despertador principal agora é o pg_cron do Supabase (migration
# 20261208000000_despertador_supabase.sql), porque o agendamento do GitHub
# atrasa muito ou nem roda. Mantém o site acordado no plano grátis do Render,
# que "dorme" depois de ~15 min sem uso (tela "service waking up").
# A Agenda tem um workspace só dela no Render ("IASD Agenda"), então as
# 750 h grátis do mês dão para deixá-la ligada o tempo todo.

on:
  schedule:
    - cron: "*/10 * * * *" # a cada 10 minutos (o GitHub pode atrasar um pouco)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acordar o site
        run: |
          # /api/cron/tick mantém o site acordado e, a partir das 18h, dispara
          # (uma vez por dia) o lembrete de véspera da escala para os líderes.
          URL="https://7lider.com.br/api/cron/tick"
          for tentativa in 1 2; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo 000)
            echo "Tentativa $tentativa: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          exit 1
